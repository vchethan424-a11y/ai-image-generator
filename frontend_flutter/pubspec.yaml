name: frontend_flutter

description: "AI Image Generator App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

# ============================================
# DEPENDENCIES
# ============================================

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ============================================
  # STATE MANAGEMENT
  # ============================================

  provider: ^6.1.2

  # ============================================
  # NETWORK
  # ============================================

  http: ^1.2.2

  # ============================================
  # LOCAL STORAGE
  # ============================================

  shared_preferences: ^2.3.2

  # ============================================
  # IMAGE HANDLING
  # ============================================

  cached_network_image: ^3.4.1

  gallery_saver_plus: ^3.2.2

  path_provider: ^2.1.4

  permission_handler: ^11.3.1

  # ============================================
  # ENV
  # ============================================

  flutter_dotenv: ^5.1.0

  # ============================================
  # UI
  # ============================================

  google_fonts: ^6.2.1

  flutter_spinkit: ^5.2.1

# ============================================
# DEV DEPENDENCIES
# ============================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# ============================================
# FLUTTER CONFIG
# ============================================

flutter:

  uses-material-design: true

  # ============================================
  # ASSETS
  # ============================================

  assets:
    - .env
    - assets/images/
    - assets/icons/
    - assets/animations/